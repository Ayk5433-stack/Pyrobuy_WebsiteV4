  --exp:#a3245e; --exp-bg:#f8e1ec; --due:#6a45c4; --due-bg:#efe9fd; --new:#1e6aa8; --new-bg:#e1eef9; --miss:#8a93a3; --miss-bg:#edf0f4;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 4px 14px rgba(20,26,38,.05); --bar-ink:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --panel:#171c27; --sunk:#1f2533; --ink:#e6eaf2; --muted:#98a2b5; --line:#2a3141;
  --accent:#7d95ff; --accent-ink:#0f131b; --accent-soft:#232c4d;
  --ok:#4cc79a; --ok-bg:#15352b; --warn:#e8b54d; --warn-bg:#3a3018; --bad:#ff7676; --bad-bg:#3f1d20;
  --exp:#ff79b0; --exp-bg:#3d1b2c; --due:#b59cff; --due-bg:#2a2445; --new:#6db5ff; --new-bg:#162c45; --miss:#8a93a3; --miss-bg:#252b37;
  --shadow:0 1px 2px rgba(0,0,0,.3); --bar-ink:#0f131b; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f131b; --panel:#171c27; --sunk:#1f2533; --ink:#e6eaf2; --muted:#98a2b5; --line:#2a3141;
  --accent:#7d95ff; --accent-ink:#0f131b; --accent-soft:#232c4d;
  --ok:#4cc79a; --ok-bg:#15352b; --warn:#e8b54d; --warn-bg:#3a3018; --bad:#ff7676; --bad-bg:#3f1d20;
  --exp:#ff79b0; --exp-bg:#3d1b2c; --due:#b59cff; --due-bg:#2a2445; --new:#6db5ff; --new-bg:#162c45; --miss:#8a93a3; --miss-bg:#252b37;
  --shadow:0 1px 2px rgba(0,0,0,.3); --bar-ink:#0f131b; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;line-height:1.3}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;max-width:100%;min-width:0}
textarea{width:100%;resize:vertical}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;gap:14px;align-items:center;padding:10px 16px;max-width:1360px;margin:0 auto}
.brand{font:700 21px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;flex:none}
.brand span{color:var(--accent)}.brand .btxt{color:inherit}.brand .btxt span{color:var(--accent)}
#q{flex:1;min-width:0}
.themebtn{flex:none;width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink)}
.themebtn svg{width:19px;height:19px}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none;max-width:1360px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 11px;white-space:nowrap;color:var(--muted);font-weight:500}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center;margin-left:5px;font-weight:600}
#demo-bar{background:var(--accent-soft);color:var(--ink);text-align:center;font-size:12.5px;padding:6px 16px}
main{padding-block:16px 40px;padding-inline:16px;max-width:1360px;margin:0 auto}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:18px}
h2.sec{font:650 17px/1.25 var(--f-body);letter-spacing:-.005em;color:var(--ink);margin:0 0 12px}
.err{color:var(--bad)}

/* chips & dots */
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-ok{color:var(--ok);background:var(--ok-bg)}.s-warn{color:var(--warn);background:var(--warn-bg)}.s-bad{color:var(--bad);background:var(--bad-bg)}
.s-exp{color:var(--exp);background:var(--exp-bg)}.s-due{color:var(--due);background:var(--due-bg)}.s-new{color:var(--new);background:var(--new-bg)}.s-miss{color:var(--miss);background:var(--miss-bg)}.s-na{color:var(--ok);background:var(--sunk)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--ok)}.d-na{background:var(--ok);opacity:.45}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-exp{background:var(--exp)}.d-due{background:var(--due)}.d-new{background:var(--new)}.d-miss{background:transparent;box-shadow:inset 0 0 0 2px var(--miss)}

/* dashboard */
.dash-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:14px}
.ready-num{font:700 64px/0.95 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ready-num small{font-size:26px;color:var(--muted);font-weight:600}
.meter{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.rules{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:12px}
.rules dt{color:var(--muted)}.rules dd{margin:0;font-weight:500}
.health{display:flex;flex-direction:column;gap:16px}
.hrow2{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.hlabel{font-weight:600}
.hlabel small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.sbar{display:flex;gap:2px;height:30px;border-radius:7px;overflow:hidden}
.sbar button{border:none;border-radius:0;padding:0;min-width:3px;font:600 12px/30px var(--f-body);color:var(--bar-ink);overflow:hidden;white-space:nowrap;text-overflow:clip;font-variant-numeric:tabular-nums}
.sbar button:hover{filter:brightness(1.12)}
.b-ok{background:var(--ok)}.b-na{background:var(--ok);opacity:.55}.b-due{background:var(--due)}.b-new{background:var(--new)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}.b-exp{background:var(--exp)}
.b-miss{background:repeating-linear-gradient(135deg,var(--miss-bg) 0 6px,var(--sunk) 6px 12px)!important;color:var(--muted)!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.alert{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left}
.alert b{font:700 30px/1 var(--f-display);color:var(--bad);font-variant-numeric:tabular-nums}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lst{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 14px;border-radius:10px;background:var(--panel)}
.lst b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.lst.zero b{color:var(--ok)}

/* items list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;border-radius:0;padding:6px 11px}
.seg button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;gap:10px}
.grid.m{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.grid.l{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.tile:hover{border-color:var(--accent)}
.thumb{aspect-ratio:16/10;max-width:100%;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tbody{padding:7px 10px 9px;min-width:0}
.tno{font:500 13px var(--f-mono)}
.tname{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdots{display:flex;gap:8px;margin-top:6px;align-items:center;font-size:11px;color:var(--muted)}
.tdots span{display:inline-flex;gap:3px;align-items:center}
.grid.s .tname{display:none}.grid.s .tbody{padding:4px 6px}.grid.s .tno{font-size:11px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);font-weight:600}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--bg)}
td .mini{width:64px;height:40px;object-fit:cover;border-radius:4px;display:block;background:var(--sunk)}
.more{text-align:center;margin:14px}

/* item profile */
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.linkbtn{border:none;background:none;padding:0;color:var(--accent);font-weight:500}
.phead{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:18px;align-items:start}
.phead .pthumb{aspect-ratio:16/10;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.phead .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pno{font:500 13px var(--f-mono);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pname{font:700 34px/1.05 var(--f-display);margin:4px 0 10px;text-wrap:balance}
.psum{display:flex;flex-wrap:wrap;gap:8px}
.psum button{display:inline-flex;gap:7px;align-items:center;padding:5px 11px;border-radius:999px;font-size:13px}
.pfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;margin-top:14px;font-size:13px}
.pfacts div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.navbtns{display:flex;gap:8px;flex-wrap:wrap}
.bigbtn{padding:9px 15px;font-size:14px}
.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.asset{display:flex;flex-direction:column;gap:9px;min-width:0}
.asset h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;font:650 17px/1.2 var(--f-body);letter-spacing:-.005em}
.prev{aspect-ratio:16/9;max-width:100%;background:var(--sunk);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted);font-size:13px;text-align:center}
.prev.prev-empty{aspect-ratio:auto;min-height:0;height:auto;padding:12px;font-size:13px}
.prev img,.prev iframe,.prev video{width:100%;height:100%;object-fit:contain;border:0;display:block}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,22,.18);border:none;border-radius:0;color:#fff;font-size:40px}
.loadvid{border:none;background:none;color:var(--muted);font-size:14px;font-weight:600}
.sbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtns button{padding:8px 4px;font-weight:600;font-size:13px}
.bigbtn.passed{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.sbtns .on-ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.sbtns .on-warn{background:var(--warn);border-color:var(--warn);color:var(--panel)}
.sbtns .on-bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meta b{color:var(--ink);font-weight:600}
.linkrow{display:flex;gap:6px;align-items:center}.linkrow input{flex:1;min-width:0}
.linkview{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkchip{font-size:12.5px;background:var(--sunk);border-radius:6px;padding:4px 8px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.updated{font-size:12.5px;border-radius:8px;padding:6px 10px;background:var(--sunk);overflow-wrap:anywhere}
.updated.fresh{background:var(--new-bg)}.updated.fresh b{color:var(--new)}
.qseg button{padding:4px 12px;font-size:12.5px;font-weight:600}
.thumb{position:relative}
.newlink{position:absolute;top:6px;left:6px;background:var(--new);color:var(--panel);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.passmark{position:absolute;right:6px;bottom:6px;z-index:1;font:700 10px/1 var(--f-body);padding:4px 6px;border-radius:5px;background:var(--ok);color:var(--panel)}
.extra{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;font-size:13px;margin:0}
.extra dt{color:var(--muted)}.extra dd{margin:0;overflow-wrap:anywhere}
.hist td{white-space:normal;vertical-align:top}
.hist td.w{max-width:340px;overflow-wrap:anywhere}
.kbd{font-size:12px;color:var(--muted);margin:0}

/* new videos, import, settings */
.vrow{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:none}
.naline{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.naopts{margin-top:6px}
.wgroups{display:grid;gap:12px}
.updflag{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:12.5px}
.updflag b{color:var(--warn)}
.updflag button{padding:2px 8px;font-size:12px}
.s-upd{color:var(--warn);background:var(--warn-bg)}
.psum .flagged{border-color:var(--warn)}
.psum .updtxt{color:var(--warn)}
.protectbox{border:1px solid var(--line);border-left:3px solid var(--new);border-radius:8px;padding:10px 12px;background:var(--sunk);font-size:13.5px}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.filtbtn{display:inline-flex;gap:6px;align-items:center}
.filtbtn.on{border-color:var(--accent);color:var(--accent)}
.fcount{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.filtpanel{margin:-4px 0 12px;padding:14px 16px}
.fgrid{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.fgrid .rfgroup{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px}
.fgrid .rfgroup select{max-width:300px}
.fgrid .rfgroup:has(#rfs){display:grid;grid-template-columns:auto auto;gap:4px 8px}
.fgrid .rfgroup:has(#rfs) label{grid-column:1/-1}
.itemtable{max-height:calc(100vh - 230px);min-height:320px;overflow:auto}
.itemtable th{z-index:2}
.itemtable .stick{position:sticky;left:0;z-index:1;background:var(--panel);box-shadow:1px 0 0 var(--line)}
.itemtable th.stick{z-index:3}
.itemtable tbody tr.click:hover td.stick{background:var(--bg)}
.mbar{display:none}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.rstats div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.rstats b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.rstats span{font-size:12px;color:var(--muted)}
.statpair{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.statpair>div{min-width:0}
.ready-num.rv{color:var(--new)}
.plbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--new-bg);margin-bottom:10px;font-size:14px}
.picdrop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.picdrop.on{border-color:var(--new);color:var(--new)}
.picprog{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:10px 0}
.picprog i{display:block;height:100%;background:var(--new);width:0;transition:width .2s}
.pictab td,.pictab th{font-size:13px}
.unk{display:inline-flex;gap:4px;margin:2px}
#plitems{width:100%;font-family:var(--f-mono);font-size:13px}
.rfgroup{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.rfgroup select{max-width:260px}
tr.kept td{opacity:.75}
.wglabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.segpick small{opacity:.65;font-weight:500}
.desc{white-space:pre-wrap;margin:0;line-height:1.5}
.descsug{margin-top:10px;padding:10px 12px;border-left:3px solid var(--new);background:var(--sunk);border-radius:6px}
#descnew{width:100%}
.vrev{display:grid;gap:12px}
.vcmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.vcmp{grid-template-columns:1fr}}
.vlabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.vlabel.new{color:var(--new)}
.vthumb{aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--sunk);margin-bottom:8px}
.vthumb iframe{width:100%;height:100%;border:0;display:block}
.vplay{all:unset;cursor:pointer;display:block;width:100%;height:100%;position:relative}
.vplay img{width:100%;height:100%;object-fit:cover;display:block}
.vplay span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px}
.vplay:focus-visible{outline:3px solid var(--new);outline-offset:2px}
.vempty{aspect-ratio:16/9;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:13px;color:var(--muted)}
.vdecide{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.vdecide input{width:140px}
.vrow img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;max-width:100%}
.vact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.vact input{width:120px}
.form{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px 16px;align-items:center}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* login, toast, modal */
.login{max-width:400px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px}
.login .brand{font-size:28px;justify-content:center}
.loginlogo{width:112px;height:112px;margin:0 auto 4px;display:block}
.login label{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:13px}

<body>
<div id="demo-bar" hidden></div>
<header id="hdr" hidden>
  <div class="hrow">
    <div class="brand"><img class="logo" alt="Dominator Fireworks" src="" data-logo><span class="btxt">Marketing <span>Portfolio</span></span></div>
    <input id="q" type="search" placeholder="Search item #, name or video title" aria-label="Search items">
    <button id="themebtn" class="themebtn" data-act="theme" type="button"></button>
  </div>
  <nav id="nav">
    <button data-go="dash">Dashboard</button>
    <button data-go="items">Items</button>
    <button data-go="review">Review</button>
    <button data-go="videos">YouTube review<span id="vbadge"></span></button>
    <button data-go="import" id="nav-import">Import links</button>
    <button data-go="testing" id="nav-testing">Testing list</button>
    <button data-go="settings">Settings</button>
  </nav>
</header>
<main id="main"><div id="loading">Loading portfolio…</div></main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="busy" hidden role="status" aria-live="polite"><i></i><span>Working…</span></div>

<script>
/* =============================== state =============================== */
const S = {
  items: [], byNo: {}, videos: [], settings: {}, user: '', lastJob: '',
  view: 'dash', filter: 'all', search: '', priceOnly: true, cat: '', categories: [], layout: 'table', size: 'm', seg: '', rangeDays: 30, rangeTodo: true, lists: [], plist: '', pic: null, rfWhich: 'item', rfState: '', keep: new Set(), keptN: 0,
  queue: [], qi: 0, queueLabel: '', shown: 300, preview: [], vsel: {}
};
const DEMO = typeof window.DEMO_API === 'function';
const ASSETS = [
  { k: 'photo', label: 'Photo', short: 'P' },
  { k: 'video', label: 'Physical video', short: 'V' },
  { k: 'yt', label: 'YouTube', short: 'Y' },
  { k: 'ub', label: 'Unbranded video', short: 'U' }
];
const STATUS_BTNS = ['Acceptable', 'Needs update', 'Unacceptable'];
const ORDER = ['Acceptable', 'Not needed', 'Review due', 'Unreviewed', 'Needs update', 'Unacceptable', 'Expired', 'Missing'];
const CLS = { 'Acceptable': 'ok', 'Not needed': 'na', 'Needs update': 'warn', 'Unacceptable': 'bad', 'Expired': 'exp', 'Review due': 'due', 'Unreviewed': 'new', 'Missing': 'miss' };
const BAD = new Set(['Needs update', 'Unacceptable']);
const FIELD_LABEL = {
  photo_url: 'Photo link', photo_status: 'Photo status', photo_note: 'Photo note',
  ub_url: 'Unbranded video link', ub_status: 'Unbranded video status', ub_note: 'Unbranded video note', ub_quality: 'Unbranded video quality',
  video_url: 'Physical video link', video_status: 'Physical video status', video_note: 'Physical video note', video_quality: 'Physical video quality',
  yt_url: 'YouTube link', yt_status: 'YouTube status', yt_note: 'YouTube note', yt_quality: 'YouTube quality',
  name: 'Name', category: 'Product category', on_price_sheet: 'On price sheet'
};
let CUT = new Date(new Date().getFullYear() - 3, 0, 1);

/* =============================== helpers =============================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const main = $('#main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(); };
const isoDay = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + Number(n)); return x; };
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
const norm = v => String(v == null ? '' : v).trim().toUpperCase();
const nf = n => Number(n).toLocaleString();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } }
};
const AUTH = { token: store.get('mp_token') || '', name: store.get('mp_user') || '' };

const canEdit = () => S.role === 'Editor' || S.role === 'Admin';
const isAdmin = () => S.role === 'Admin';

/* ---------- light / dark mode ---------- */
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>';
const sysDark = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
const themeChoice = () => document.documentElement.getAttribute('data-theme') || 'auto';
const isDark = () => { const t = themeChoice(); return t === 'auto' ? sysDark() : t === 'dark'; };
function setTheme(t) {
  if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); store.set('mp_theme', t); }
  else { document.documentElement.removeAttribute('data-theme'); store.del('mp_theme'); }
  updateThemeBtn();
  if (S.view === 'settings') render();
}
function updateThemeBtn() {
  const b = document.getElementById('themebtn'); if (!b) return;
  const d = isDark();
  b.innerHTML = d ? ICON_SUN : ICON_MOON;
  b.title = d ? 'Switch to light mode' : 'Switch to dark mode';
  b.setAttribute('aria-label', b.title);
}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeBtn); } catch (e) { /* older browsers */ }

/* =============================== Supabase connection =============================== */
let memConf = {};
const CONF = () => ({
  url: String(SUPABASE_URL || store.get('mp_sb_url') || memConf.url || '').trim().replace(/\/+$/, ''),
  key: String(SUPABASE_KEY || store.get('mp_sb_key') || memConf.key || '').trim()
});
const isConnected = () => !!(CONF().url && CONF().key);

async function rpc(fn, body) {
  const c = CONF();
  const headers = { 'Content-Type': 'application/json', apikey: c.key };
  if (/^eyJ/.test(c.key)) headers.Authorization = 'Bearer ' + c.key;   // older "anon" keys
  let r;
  try { r = await fetch(c.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: headers, body: JSON.stringify(body || {}) }); }
  catch (e) { throw new Error('Could not reach the database. Check your internet connection and SUPABASE_URL at the top of this file.'); }
  let j = null;
  try { j = await r.json(); } catch (e) { /* empty body */ }
  if (!r.ok) {
    const msg = String((j && (j.message || j.msg || j.error_description || j.error)) || ('Database error ' + r.status));
    if (r.status === 404 || /Could not find the function/i.test(msg)) throw new Error('The database is missing the portfolio functions. Run supabase-setup.sql in Supabase → SQL Editor.');
    if (r.status === 401 || /api key/i.test(msg)) throw new Error('The Supabase key is not right. Check SUPABASE_KEY at the top of this file.');
    const err = new Error(msg.replace(/^AUTH:\s*/, '')); err.auth = /^AUTH:/.test(msg); throw err;
  }
  return j;
}
const tok = () => AUTH.token;

/* =============================== YouTube (runs in the browser with the key from Settings) =============================== */
async function ytApi(path, params) {
  const key = String(S.settings.youtube_api_key || '').trim();
  if (!key) throw new Error('Add the YouTube API key in Settings first (an administrator can do this).');
  let r;
  try { r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + new URLSearchParams(Object.assign({}, params, { key: key }))); }
  catch (e) { throw new Error('Could not reach YouTube. Check your internet connection.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) {
    const m = String((j.error && j.error.message) || ('YouTube error ' + r.status)).replace(/<[^>]+>/g, '');
    if (/referer|referrer|blocked/i.test(m)) throw new Error('YouTube refused requests from this web address. In Google Cloud Console → Credentials, add this site to the API key\'s allowed websites.');
    if (/quota/i.test(m)) throw new Error('The YouTube daily quota is used up. It resets at midnight Pacific time.');
    throw new Error('YouTube: ' + m);
  }
  return j;
}
function isoDur(s) {
  const m = String(s || '').match(/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/);
  if (!m) return '';
  const h = (+m[1] || 0) * 24 + (+m[2] || 0), mi = +m[3] || 0, se = +m[4] || 0;
  return (h ? h + ':' + String(mi).padStart(2, '0') : mi) + ':' + String(se).padStart(2, '0');
}
/** {videoId: {yt_title, yt_channel, yt_published, yt_definition, yt_duration, yt_views}} */
async function ytMeta(ids) {
  const out = {}, uniq = [...new Set(ids.filter(Boolean))];
  for (let i = 0; i < uniq.length; i += 50) {
    const j = await ytApi('videos', { part: 'snippet,contentDetails,statistics', id: uniq.slice(i, i + 50).join(','), maxResults: 50 });
    (j.items || []).forEach(v => {
      out[v.id] = {
        yt_title: v.snippet.title, yt_channel: v.snippet.channelTitle, yt_published: v.snippet.publishedAt,
        yt_definition: String(v.contentDetails.definition || '').toUpperCase(), yt_duration: isoDur(v.contentDetails.duration),
        yt_views: v.statistics && v.statistics.viewCount != null ? String(v.statistics.viewCount) : ''
      };
    });
  }
  return out;
}
const alnum = v => norm(v).replace(/[^A-Z0-9]/g, '');
/** Finds a tracker item number inside a video title. */
function itemMatcher() {
  const set = {};
  S.items.forEach(it => { const k = alnum(it.item_no); if (k.length >= 3 && /\d/.test(k)) set[k] = it.item_no; });
  return title => {
    const t = String(title || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
    let best = '';
    for (let n = 3; n >= 1; n--) for (let j = 0; j + n <= t.length; j++) { const k = t.slice(j, j + n).join(''); if (set[k] && k.length > best.length) best = k; }
    return best ? set[best] : '';
  };
}
function channelRef(h) {
  h = String(h || '').trim();
  let m = h.match(/youtube\.com\/channel\/(UC[A-Za-z0-9_-]{22})/i); if (m) return m[1];
  m = h.match(/youtube\.com\/(@[A-Za-z0-9._-]+)/i); if (m) return m[1];
  return h.replace(/\/+$/, '');
}

/* =============================== item editing rules =============================== */
const EDITABLE = new Set(['name', 'category', 'on_price_sheet']);
['photo', 'video', 'ub', 'yt'].forEach(a => ['_url', '_status', '_note'].forEach(f => EDITABLE.add(a + f)));
['video', 'ub', 'yt'].forEach(a => EDITABLE.add(a + '_quality'));
['photo', 'video', 'ub', 'yt'].forEach(a => { EDITABLE.add(a + '_na'); EDITABLE.add(a + '_later'); });
EDITABLE.add('segment'); EDITABLE.add('desc_suggested');
EDITABLE.add('yt_published');
const YT_META_KEYS = ['yt_title', 'yt_channel', 'yt_published', 'yt_definition', 'yt_duration', 'yt_views'];
function resetAsset(a) {
  const o = {}; o[a + '_status'] = ''; o[a + '_reviewed_at'] = ''; o[a + '_reviewed_by'] = ''; o[a + '_na'] = ''; o[a + '_later'] = '';
  if (a !== 'photo') o[a + '_quality'] = '';
  if (a === 'yt') { YT_META_KEYS.forEach(k => { o[k] = ''; }); o.yt_id = ''; }
  return o;
}
/** Turns what the person changed into the full set of fields to store (a new link resets its review, etc.). */
function buildPatch(base, patch) {
  const out = {}, log = [], needYt = [], now = new Date().toISOString(), user = S.user, no = base.item_no;
  Object.keys(patch).forEach(k => {
    if (!EDITABLE.has(k)) return;
    const v = patch[k] == null ? '' : String(patch[k]).trim();
    const old = base[k] == null ? '' : String(base[k]);
    const m = k.match(/^(photo|video|ub|yt)_(url|status)$/);
    if (m && m[2] === 'url') {
      if (v === old) return;
      if (m[1] === 'yt' && v && ytId(v) && ytId(v) === base.yt_id) { out[k] = v; return; }
      Object.assign(out, resetAsset(m[1]));
      out[m[1] + '_prev_url'] = old;
      out[m[1] + '_link_updated_at'] = now; out[m[1] + '_link_updated_by'] = user;
      if (m[1] === 'yt') { const id = ytId(v); out.yt_id = id; if (id) needYt.push(id); }
      out[k] = v;
      log.push({ item_no: no, field: k, old: old, new: v });
      return;
    }
    if (m && m[2] === 'status') {
      if (['', 'Acceptable', 'Needs update', 'Unacceptable'].indexOf(v) < 0) throw new Error('Unknown status: ' + v);
      out[k] = v; out[m[1] + '_reviewed_at'] = v ? now : ''; out[m[1] + '_reviewed_by'] = v ? user : '';
      if (base[m[1] + '_upd_at']) { out[m[1] + '_upd_at'] = ''; out[m[1] + '_upd_by'] = ''; out[m[1] + '_upd_src'] = ''; out[m[1] + '_upd_kind'] = ''; }   // reviewed: the "updated" flag is done
      log.push({ item_no: no, field: k, old: old, new: (v || '(cleared)') + (base[m[1] + '_upd_at'] ? ' (reviewed update)' : '') });
      return;
    }
    if (/_quality$/.test(k) && ['', '720p', '1080p', '4K'].indexOf(v) < 0) throw new Error('Quality must be 720p, 1080p or 4K.');
    if (k === 'segment' && ['', 'consumer', 'pro', 'display'].indexOf(v) < 0) throw new Error('Unknown type: ' + v);
    if (/_(na|later)$/.test(k) || k === 'desc_suggested') { out[k + '_by'] = v ? user : ''; out[k + '_at'] = v ? now : ''; }
    out[k] = v;
    if (v !== old) log.push({ item_no: no, field: k, old: old, new: v });
  });
  return { patch: out, log: log, needYt: needYt };
}
async function saveRows(rows, log) {
  const out = [];
  for (let i = 0; i < rows.length; i += 400) {
    const part = await rpc('mp_save_items', { p_token: tok(), p_rows: rows.slice(i, i + 400), p_log: i === 0 ? (log || []) : [] });
    out.push(...part);
  }
  return out;
}
function normSettings(s) {
  s = Object.assign({}, s || {});
  s.review_months = Number(s.review_months) || 6;
  s.youtube_years = Number(s.youtube_years) || 3;
  return s;
}

/* =============================== actions (same names the screens use) =============================== */
const BE = {
  async login(u, p, rem) {
    const r = await rpc('mp_login', { p_username: u, p_password: p, p_remember: !!rem });
    if (r.error) { const e = new Error(r.error); e.auth = true; throw e; }
    return r;
  },
  logout: () => rpc('mp_logout', { p_token: tok() }),
  async getData() {
    const d = await rpc('mp_get_data', { p_token: tok() });
    d.settings = normSettings(d.settings);
    d.lastJob = d.settings.last_scan || '';
    d.user = d.me && d.me.username;
    return d;
  },
  getItemLog: no => rpc('mp_get_item_log', { p_token: tok(), p_item_no: no }),
  async cleanExtras() {
    const rows = S.items.filter(it => it.extra && Object.keys(it.extra).some(k => !DESC_KEYS.includes(k))).map(it => {
      const keep = {}; DESC_KEYS.forEach(k => { if (it.extra[k]) keep[k] = it.extra[k]; });
      return { item_no: it.item_no, patch: { extra: keep } };
    });
    if (rows.length) await saveRows(rows, [{ item_no: '(settings)', field: 'price-list details', old: '', new: 'Removed from ' + rows.length + ' items' }]);
    return rows.length;
  },
  saveList: list => rpc('mp_save_list', { p_token: tok(), p_list: list }),
  deleteList: id => rpc('mp_delete_list', { p_token: tok(), p_id: id }),
  async saveItem(no, patch, base) {
    base = base || getItem(no);
    const b = buildPatch(base, patch);
    if (!Object.keys(b.patch).length) return base;
    const row = { item_no: base.item_no, patch: b.patch };
    const out = await saveRows([row], b.log);
    await BE._syncVideoStatuses([row]);
    return out[0];
  },
  async importItems(rows, markOff) {
    const seen = {}, save = [];
    let created = 0, updated = 0;
    rows.forEach(r => {
      const key = String(r.item_no || '').trim(); if (!key || seen[norm(key)]) return;
      seen[norm(key)] = 1;
      const cur = getItem(key), patch = { on_price_sheet: 'Yes' };
      if (r.name) patch.name = String(r.name).trim();
      if (r.category) patch.category = String(r.category).trim();
      if (cur) updated++; else created++;
      save.push({ item_no: cur ? cur.item_no : key, patch: patch });
    });
    await saveRows(save, [{ item_no: '(import)', field: 'item list', old: '', new: 'Imported ' + save.length + ' items' }]);
    let markedOff = 0;
    if (markOff) markedOff = await rpc('mp_mark_off_sheet', { p_token: tok(), p_keep: save.map(r => r.item_no) });
    return { created: created, updated: updated, markedOff: markedOff };
  },
  async importLinks(rows) {
    const res = { updated: 0, same: 0, notFound: [], unmatched: [] };
    const work = {}, logs = [];
    rows.forEach(r => {
      if (['photo', 'video', 'ub', 'yt'].indexOf(r.type) < 0 || !r.url) return;
      if (!r.item_no) { res.unmatched.push(r.url); return; }
      const it = getItem(r.item_no);
      if (!it) { res.notFound.push(r.item_no); return; }
      const k = norm(it.item_no);
      const w = work[k] || (work[k] = { base: Object.assign({}, it), patch: {} });
      const p = {}; p[r.type + '_url'] = r.url;
      const b = buildPatch(Object.assign({}, w.base, w.patch), p);
      if (b.log.length) { res.updated++; Object.assign(w.patch, b.patch); logs.push(...b.log); } else res.same++;
    });
    const save = Object.values(work).filter(w => Object.keys(w.patch).length).map(w => ({ item_no: w.base.item_no, patch: w.patch }));
    await saveRows(save, logs);
    await BE._syncVideoStatuses(save);
    return res;
  },
  /** Pasted links or item numbers from the video editor: flag each asset "updated" (approval kept), update the link if it changed, and save the batch as a list. */
  async flagUpdates(rows, listName) {
    const work = {}, logs = [], now = new Date().toISOString(), res = { flagged: 0, linkChanged: 0, items: [], notFound: [] };
    rows.forEach(r => {
      const it = getItem(r.item_no); if (!it) { res.notFound.push(r.item_no); return; }
      const a = r.type, k = norm(it.item_no);

/* Links are never changed silently. Loading a spreadsheet:
   - fills a link only where the tracker has none, or where the spreadsheet has a different link that nobody changed in the program;
   - keeps any link someone changed in the program (card edit, paste import or approved YouTube upload) unless "replace" is ticked;
   - never rewrites a YouTube link that points to the same video in a different format (youtu.be vs watch?v=);
   - keeps upload date / title / channel already in the tracker for the same video;
   - when it does replace a link, keeps the old one as "previous", logs it, and resets that asset's review. */

    if (cur) {

        const sv = patch[a + '_url'], cv = cur[a + '_url'];
        const dropMeta = () => { if (a === 'yt') LINK_META.forEach(k => { delete patch[k]; }); };
        if (!sv) { if (a === 'yt' && cv) LINK_META.forEach(k => { if (cur[k]) delete patch[k]; }); return; }   // nothing in the sheet: keep everything
        if (!cv) return;                                                                                          // tracker empty: fill it
        if (sameLink(a, sv, cv)) { delete patch[a + '_url']; if (a === 'yt') LINK_META.forEach(k => { if (cur[k]) delete patch[k]; }); return; }

/* One row per item across those lists: how often it was tested and when. */
function rangeRows(days) {
  const m = {};
  rangeLists(days).slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach(l => {
    const seen = new Set();
    l.items.forEach(n => {
      const it = getItem(n), key = norm(it ? it.item_no : n);
      if (seen.has(key)) return; seen.add(key);
      const r = m[key] || (m[key] = { no: it ? it.item_no : n, it: it, times: 0, first: l.created_at, last: l.created_at, lists: [] });
      r.times++; r.last = l.created_at; r.lists.push(l.name);

  });
  return Object.values(m);
}
function plistResolve(id) {

    const d = +mm[1], ls = rangeLists(d), rows = rangeRows(d).sort((a, b) => new Date(b.last) - new Date(a.last));
    return { id: id, range: d, name: 'All testing lists · ' + rangeLabel(d), items: rows.map(r => r.no), count: ls.length };
  }
  return S.lists.find(x => String(x.id) === id) || null;
}

  const out = [['Item #', 'Item name', 'Type', 'What needs to be done', 'Video work needed?', 'Times on testing lists', 'First tested', 'Last tested', 'Testing lists', 'Photo', 'Physical video', 'YouTube', 'Reviewed?', 'Physical video link', 'YouTube link']];
  rows.forEach(r => {

  });

function filtered() {
  const f = getFilter(S.filter)[2];
  const q = S.search.trim().toLowerCase();
  const kept = [];
  const out = scoped().filter(it => {
    const hit = !q ||
    String(it.item_no).toLowerCase().includes(q) ||
    String(it.name).toLowerCase().includes(q) ||
    String(it.category).toLowerCase().includes(q) ||
    String(it.yt_title).toLowerCase().includes(q) ||
    (it.extra && JSON.stringify(it.extra).toLowerCase().includes(q));
    if (!hit) return false;
    if (f(it) && rfTest(it)) return true;
    if (S.keep.has(norm(it.item_no))) { kept.push(it); }   // reviewed while this list was open: keep it, at the bottom

/* =============================== routing =============================== */
function setHash(h, replace) {
  try { if (replace) history.replaceState(null, '', h); else history.pushState(null, '', h); } catch (e) { /* history unavailable */ }
}
function go(v, opts) {
  opts = opts || {};
  if (v === 'review') {
    S.queue = filtered().map(it => it.item_no); S.qi = 0;
    S.queueLabel = getFilter(S.filter)[1] + (S.search ? ' · search "' + S.search + '"' : '');
    if (!S.queue.length) { toast('No items in this view to review.'); return; }
    return openItem(S.queue[0], false);
  }
  S.view = v;
  if (v === 'items') S.shown = 300;
  setHash('#/' + v, opts.replace);
  paint();
}
function openItem(no, replace) {
  const i = S.queue.findIndex(x => norm(x) === norm(no));
  if (i >= 0) S.qi = i;
  else { S.queue = [no]; S.qi = 0; S.queueLabel = ''; }
  S.view = 'item';
  setHash('#/item/' + encodeURIComponent(no), replace);
  paint();
}
function fromHash() {
  const m = (location.hash || '').match(/^#\/(\w+)(?:\/(.+))?$/);
  if (!m) return { v: 'dash' };
  return { v: m[1], no: m[2] ? decodeURIComponent(m[2]) : '' };
}
function routeFromHash() {
  const r = fromHash();
  if (r.v === 'item' && r.no && getItem(r.no)) {
    if (!S.queue.length || !S.queue.some(x => norm(x) === norm(r.no))) {
      S.queue = filtered().map(it => it.item_no);
      S.queueLabel = getFilter(S.filter)[1];
    }
    const i = S.queue.findIndex(x => norm(x) === norm(r.no));
    if (i < 0) { S.queue = [r.no]; S.qi = 0; } else S.qi = i;
    S.view = 'item';
  } else S.view = r.v === 'users' ? 'settings' : ['dash', 'items', 'videos', 'import', 'testing', 'settings'].includes(r.v) ? r.v : 'dash';
  if (S.view === 'import' && !canEdit()) S.view = 'dash';
  paint();
}
window.addEventListener('popstate', routeFromHash);
function paint() {
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === (S.view === 'item' ? 'review' : S.view)));
  const on = $('#nav button.on'), nav = $('#nav');
  if (on && nav && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = Math.max(0, on.offsetLeft - (nav.clientWidth - on.offsetWidth) / 2);   // keep the current tab visible on phones

}

async function save(no, patch, quiet) {
  const it = getItem(no); if (!it) return;
  const backup = Object.assign({}, it);
  Object.keys(patch).forEach(k => {
    it[k] = patch[k];
    const m = k.match(/^(photo|video|ub|yt)_status$/);
    if (m) { it[m[1] + '_reviewed_at'] = patch[k] ? new Date().toISOString() : ''; it[m[1] + '_reviewed_by'] = patch[k] ? S.user : ''; }
  });
  refreshCards(no);
  try {
    const fresh = await call('saveItem', it.item_no, patch, backup);
    S.keep.add(norm(it.item_no));
    replaceItem(fresh);
    refreshCards(no);
    if (!quiet) toast('Saved ' + esc(it.item_no));
  } catch (e) {
    Object.keys(it).forEach(k => delete it[k]); Object.assign(it, backup);

}

  const o = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS X|Macintosh/.test(ua) ? 'Mac' : /CrOS/.test(ua) ? 'Chromebook' : /Linux/.test(ua) ? 'Linux' : '';

function ago(at) {

/* =============================== export =============================== */
function exportSheets(list) {
  list = list.slice().sort((a, b) => natural(a.item_no, b.item_no));
  const yn = (it, a) => it[a + '_url'] ? (reviewedA(it, a) ? 'Yes' : 'No') : (eff(it, a) === 'Not needed' ? 'Not needed' : 'No link');
  const pf = (it, a) => { const e = eff(it, a); return e === 'Acceptable' ? 'Passed' : e === 'Not needed' ? 'Not needed' : (BAD.has(e) || e === 'Expired') ? 'Failed' : e === 'Missing' ? 'Missing' : e === 'Review due' ? 'Review due again' : 'Not reviewed'; };
  const rv = (it, a) => it[a + '_reviewed_at'] ? isoDay(it[a + '_reviewed_at']) + ' ' + String(it[a + '_reviewed_by'] || '').split('@')[0] : '';
  const main = [['Item #', 'Name', 'Product category', 'Type', 'On price sheet', 'Item result', 'Review progress', 'What is left',
    'Photo link', 'Photo reviewed?', 'Photo result', 'Photo status', 'Photo note', 'Photo reviewed on / by',
    'Physical video link', 'Physical video reviewed?', 'Physical video result', 'Physical video status', 'Physical video note', 'Physical video quality', 'Physical video reviewed on / by',
    'YouTube link', 'YouTube reviewed?', 'YouTube result', 'YouTube status', 'YouTube note', 'YouTube title', 'YouTube channel', 'YouTube uploaded', 'YouTube quality', 'YouTube reviewed on / by',
    'Unbranded video link', 'Unbranded video reviewed?', 'Unbranded video result', 'Unbranded video status', 'Unbranded video note', 'Unbranded video quality', 'Unbranded video reviewed on / by',
    'Description', 'Suggested description', 'Suggested by']];
  list.forEach(it => main.push([
    it.item_no, it.name, it.category, SEG_LABEL[segOf(it)], onSheet(it) ? 'Yes' : 'No', itemResult(it).r, reviewProgress(it), itemResult(it).why,
    it.photo_url, yn(it, 'photo'), pf(it, 'photo'), eff(it, 'photo'), it.photo_note, rv(it, 'photo'),
    it.video_url, yn(it, 'video'), pf(it, 'video'), eff(it, 'video'), it.video_note, it.video_quality, rv(it, 'video'),
    it.yt_url, yn(it, 'yt'), pf(it, 'yt'), eff(it, 'yt'), it.yt_note, it.yt_title, it.yt_channel, isoDay(it.yt_published), it.yt_quality, rv(it, 'yt'),
    it.ub_url, yn(it, 'ub'), pf(it, 'ub'), eff(it, 'ub'), it.ub_note, it.ub_quality, rv(it, 'ub'),
    descOf(it), it.desc_suggested, it.desc_suggested ? (it.desc_suggested_by || '') + ' ' + isoDay(it.desc_suggested_at) : ''
  ].map(v => v == null ? '' : String(v))));
  const per = (a, extra) => [['Item #', 'Name', 'Product category', 'Type', 'Link', 'Reviewed?', 'Result', 'Status', 'Note', 'Reviewed on / by'].concat(extra.map(e => e[0]))]
    .concat(list.map(it => [it.item_no, it.name, it.category, SEG_LABEL[segOf(it)], it[a + '_url'], yn(it, a), pf(it, a), eff(it, a), it[a + '_note'], rv(it, a)].concat(extra.map(e => e[1](it))).map(v => v == null ? '' : String(v))));
  return [
    { name: 'Portfolio', rows: main },
    { name: 'Photos', rows: per('photo', [['Link updated', it => isoDay(it.photo_link_updated_at)]]) },
    { name: 'Physical videos', rows: per('video', [['Quality', it => it.video_quality], ['Link updated', it => isoDay(it.video_link_updated_at)]]) },
    { name: 'YouTube', rows: per('yt', [['Passed or in progress', ytResult], ['Uploaded', it => isoDay(it.yt_published)], ['Channel', it => it.yt_channel], ['Quality', it => it.yt_quality], ['Title', it => it.yt_title], ['Link updated', it => isoDay(it.yt_link_updated_at)], ['Previous link', it => it.yt_prev_url]]) },
    { name: 'Unbranded videos', rows: per('ub', [['Quality', it => it.ub_quality], ['Link updated', it => isoDay(it.ub_link_updated_at)]]) }
  ];
}
function toWorkbook(sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const ws = XLSX.utils.aoa_to_sheet(s.rows);
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    for (let r = 1; r <= range.e.r; r++) for (let c = 0; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if (cell && typeof cell.v === 'string' && /^https?:\/\//.test(cell.v)) cell.l = { Target: cell.v };
    }
    ws['!cols'] = s.rows[0].map((h, i) => ({ wch: Math.min(60, Math.max(10, String(h).length + 2, ...s.rows.slice(1, 200).map(r => String(r[i] || '').length))) }));
    ws['!autofilter'] = { ref: ws['!ref'] };
    XLSX.utils.book_append_sheet(wb, ws, s.name);
  });
  return wb;
}
function simpleSheet(list) {
  list = list.slice().sort((a, b) => natural(a.item_no, b.item_no));
  const parts = [['video', 'Physical video'], ['yt', 'YouTube'], ['photo', 'Photo']];
  const rev = (it, a) => { const e = eff(it, a); return e === 'Not needed' ? 'N/A' : e === 'Missing' ? 'No link' : reviewedA(it, a) ? 'Yes' : 'No'; };
  const pf = (it, a) => { const e = eff(it, a); return e === 'Acceptable' || e === 'Review due' ? 'Pass' : (BAD.has(e) || e === 'Expired') ? 'Fail' : e === 'Not needed' ? 'N/A' : ''; };
  const rows = [['Item #', 'Item name'].concat(...parts.map(x => [x[1] + ' reviewed', x[1] + ' pass/fail', x[1] + ' comments']))];
  list.forEach(it => rows.push([it.item_no, it.name || ''].concat(...parts.map(x => [rev(it, x[0]), pf(it, x[0]), it[x[0] + '_note'] || '']))));
  return [{ name: 'Review summary', rows: rows }];
}
async function doExport(kind) {
  const list = kind.endsWith('all') ? S.items.slice() : filtered();
  if (kind.startsWith('simple')) {
    const fn = 'Review-summary-' + (kind.endsWith('all') ? 'all' : 'this-view') + '-' + isoDay(new Date()) + '.xlsx';
    try { XLSX.writeFile(toWorkbook(simpleSheet(list)), fn); toast('Downloading ' + esc(fn)); } catch (e) { toast('Export failed: ' + errMsg(e), 7000); }
    return;
  }
  const fname = 'Marketing-Portfolio-' + (kind.endsWith('all') ? 'all' : String(S.filter).replace(/[^\w-]+/g, '-') + (S.cat ? '-' + S.cat.replace(/[^\w-]+/g, '-') : '')) + '-' + isoDay(new Date());
  const sheets = exportSheets(list);
  try {
    if (kind.startsWith('xlsx')) { XLSX.writeFile(toWorkbook(sheets), fname + '.xlsx'); toast('Downloading ' + esc(fname) + '.xlsx'); }
    else if (kind.startsWith('csv')) { XLSX.writeFile(toWorkbook([sheets[0]]), fname + '.csv', { bookType: 'csv' }); toast('Downloading ' + esc(fname) + '.csv'); }
  } catch (e) { toast('Export failed: ' + errMsg(e), 7000); }
}

/* Daily channel scan, run quietly when an editor opens the page. */
async function autoJobs() {
  if (DEMO || !canEdit() || !String(S.settings.youtube_api_key || '').trim()) return;
  const stale = (k, hours) => { const t = new Date(S.settings[k] || 0); return isNaN(t) || Date.now() - t > hours * 36e5; };
  try {
    if (stale('last_scan', 20)) {
      const r = await call('scanChannels');
      if (r.added) { await reload(); toast(r.added + ' new YouTube upload(s) found on your channels. See New videos.', 7000); }
    }
  } catch (e) { console.warn('Automatic YouTube check skipped:', e.message); }
}

          let t = '<div class="small">' + (pl.replaced ? '<b>' + nf(pl.replaced) + ' link(s)</b> will be replaced by this spreadsheet (the old link is kept as "previous" and the review starts again). ' : 'No existing links will be replaced. ') + '</div>';
          if (K.length) t += '<div class="protectbox"><b>' + nf(K.length) + ' link(s) were changed in the program</b> and are different in this spreadsheet. <b>The program\'s links are kept.</b>' +
            '<div class="small muted" style="margin:4px 0">' + K.slice(0, 12).map(k => esc(k.item_no) + ' (' + AL[k.asset] + ')').join(', ') + (K.length > 12 ? ' and ' + (K.length - 12) + ' more' : '') + '</div>' +
            '<label class="small row"><input type="checkbox" id="wbover"> Let the spreadsheet replace these too</label></div>';
          return t;
        })() +
        '<div><button class="pri" data-act="applywb">Load ' + nf(S.wb.items.length) + ' items</button></div></div>';
    } catch (err) { $('#wbsum').innerHTML = '<p class="err">' + errMsg(err) + '</p>'; }
  }
  else if (el.id === 'mfile' && el.files[0]) { try { mapMaster(await readFileRows(el.files[0])); } catch (err) { toast('Could not read that file: ' + errMsg(err)); } }
  else if (el.id === 'lfile' && el.files[0]) { try { mapLinks(await readFileRows(el.files[0])); } catch (err) { toast('Could not read that file: ' + errMsg(err)); } }
});
let plT;
document.addEventListener('input', e => {
  if (e.target.id !== 'plitems') return;
  clearTimeout(plT); plT = setTimeout(() => { if (S.pic) S.pic.text = e.target.value; const p = $('#picprev'); if (p) p.innerHTML = picPreview(picListNos()); }, 300);
});
document.addEventListener('paste', e => {
  if (S.view !== 'testing') return;
  const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => /^image\//.test(f.type));
  if (files.length) { e.preventDefault(); handlePictures(files); }
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('#picdrop'); if (!z) return;
  e.preventDefault(); z.classList.toggle('on', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files.length) handlePictures(e.dataTransfer.files);
}));
let qT;
$('#q').addEventListener('input', e => {
  clearTimeout(qT);
  qT = setTimeout(() => { S.search = e.target.value; S.shown = 300; if (S.view !== 'items') go('items'); else render(); }, 200);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { const n = $('#m_no'); if (n) n.click(); return; }
  if (S.view !== 'item' || (e.target.closest && e.target.closest('input,textarea,select'))) return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
/* Swipe to change item (phones). Only a deliberate swipe counts: one finger, mostly sideways, at least
   about 40% of the screen width, done within ~0.6 s, not started at the screen edge, and the page must not have scrolled. */
const swipeOn = () => { try { return localStorage.getItem('mp_swipe') !== 'off'; } catch (e) { return true; } };
let sw = null;
main.addEventListener('touchstart', e => {
  sw = null;
  if (S.view !== 'item' || !swipeOn() || e.touches.length !== 1) return;
  if (e.target.closest && e.target.closest('input,textarea,select,iframe,video,a,button,.noswipe,.tablewrap')) return;
  const t = e.touches[0], W = window.innerWidth || 400;
  if (t.clientX < 28 || t.clientX > W - 28) return;            // edge gestures belong to the phone (back / forward)
  sw = { x: t.clientX, y: t.clientY, t: Date.now(), sy: window.scrollY, maxDy: 0, multi: false };
}, { passive: true });
main.addEventListener('touchmove', e => {
  if (!sw) return;
  if (e.touches.length !== 1) { sw.multi = true; return; }
  sw.maxDy = Math.max(sw.maxDy, Math.abs(e.touches[0].clientY - sw.y));
}, { passive: true });
main.addEventListener('touchend', e => {
  if (!sw) return;
  const g = sw; sw = null;
  const dx = e.changedTouches[0].clientX - g.x, dy = e.changedTouches[0].clientY - g.y, W = window.innerWidth || 400;
  const deliberate = !g.multi && Math.abs(dx) >= Math.max(120, W * 0.4) && Math.abs(dy) < 40 && g.maxDy < 45 &&
    Math.abs(dx) > 3 * Math.abs(dy) && Date.now() - g.t < 650 && Math.abs(window.scrollY - g.sy) < 4;
  if (deliberate) step(dx < 0 ? 1 : -1);
});
main.addEventListener('touchcancel', () => { sw = null; });

document.querySelectorAll('img[data-logo]').forEach(i => { i.src = LOGO; });
updateThemeBtn();
start();
</script>
